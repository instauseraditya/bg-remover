<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Background Remover</h1>
        
        <div class="upload-section">
            <label for="upload" class="upload-label">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>Choose an image</span>
            </label>
            <input type="file" id="upload" accept="image/*" hidden>
        </div>

        <div class="images-container">
            <div class="image-box">
                <h3>Original</h3>
                <div class="image-wrapper">
                    <img id="previewImg" src="" alt="Preview">
                    <p class="placeholder">No image selected</p>
                </div>
            </div>

            <div class="image-box">
                <h3>Background Removed</h3>
                <div class="image-wrapper">
                    <img id="resultImg" src="" alt="Result">
                    <p class="placeholder">Result will appear here</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="removeBtn" disabled>Remove Background</button>
            <a id="downloadBtn" class="download-btn" style="display: none;">Download Image</a>
        </div>

        <div class="info">
            <p>Upload an image and click "Remove Background" to process it using AI.</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
