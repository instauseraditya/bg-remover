<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover - Debug Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-label {
            display: inline-block;
            padding: 20px 40px;
            background: #667eea;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .upload-label:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .images-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .image-box {
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .image-box h3 {
            margin-bottom: 15px;
            color: #555;
        }

        .image-wrapper {
            min-height: 300px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e5e7eb;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 400px;
            display: none;
        }

        .image-wrapper img.show {
            display: block;
        }

        .placeholder {
            color: #9ca3af;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        button, .download-btn {
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 10px;
        }

        #removeBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #removeBtn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .download-btn {
            background: #10b981;
            color: white;
            text-decoration: none;
            display: none;
        }

        .download-btn.show {
            display: inline-block;
        }

        #status {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }

        #status.show {
            display: block;
        }

        #status.error {
            background: #fee;
            color: #c00;
        }

        #status.success {
            background: #efe;
            color: #0a0;
        }

        #status.info {
            background: #eef;
            color: #00a;
        }

        @media (max-width: 768px) {
            .images-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI Background Remover</h1>
        
        <div class="upload-section">
            <label for="upload" class="upload-label">
                📁 Choose an Image
            </label>
            <input type="file" id="upload" accept="image/*" hidden>
        </div>

        <div class="images-container">
            <div class="image-box">
                <h3>Original</h3>
                <div class="image-wrapper">
                    <img id="previewImg" alt="Preview">
                    <p class="placeholder" id="previewPlaceholder">No image selected</p>
                </div>
            </div>

            <div class="image-box">
                <h3>Background Removed</h3>
                <div class="image-wrapper">
                    <img id="resultImg" alt="Result">
                    <p class="placeholder" id="resultPlaceholder">Result will appear here</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="removeBtn" disabled>Remove Background</button>
            <a id="downloadBtn" class="download-btn">📥 Download Image</a>
        </div>

        <div id="status"></div>
    </div>

    <script type="module">
        console.log("Script loaded!");

        // Show status message
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'show ' + type;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // Try to import the library
        let removeBackground;
        try {
            showStatus('Loading AI model...', 'info');
            const module = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/dist/browser.js");
            removeBackground = module.removeBackground;
            showStatus('AI model loaded successfully!', 'success');
            console.log("Module imported successfully", module);
        } catch (error) {
            showStatus('Failed to load AI model: ' + error.message, 'error');
            console.error("Import error:", error);
        }

        const upload = document.getElementById("upload");
        const previewImg = document.getElementById("previewImg");
        const resultImg = document.getElementById("resultImg");
        const removeBtn = document.getElementById("removeBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const previewPlaceholder = document.getElementById("previewPlaceholder");
        const resultPlaceholder = document.getElementById("resultPlaceholder");

        let selectedFile;

        upload.addEventListener("change", function() {
            console.log("File input changed");
            selectedFile = upload.files[0];
            
            if (!selectedFile) {
                console.log("No file selected");
                return;
            }

            console.log("File selected:", selectedFile.name, selectedFile.type, selectedFile.size);

            if (!selectedFile.type.startsWith('image/')) {
                showStatus('Please select a valid image file', 'error');
                return;
            }

            // Preview the image
            const reader = new FileReader();
            reader.onload = function(e) {
                console.log("FileReader loaded");
                previewImg.src = e.target.result;
                previewImg.classList.add('show');
                previewPlaceholder.style.display = 'none';
                showStatus('Image loaded! Click "Remove Background" to process.', 'success');
            };
            reader.onerror = function(error) {
                console.error("FileReader error:", error);
                showStatus('Error reading file', 'error');
            };
            reader.readAsDataURL(selectedFile);

            // Reset result
            resultImg.src = "";
            resultImg.classList.remove('show');
            resultPlaceholder.style.display = 'block';
            downloadBtn.classList.remove('show');
            removeBtn.disabled = false;
        });

        removeBtn.onclick = async function() {
            console.log("Remove button clicked");
            
            if (!selectedFile) {
                showStatus('Please select an image first', 'error');
                return;
            }

            if (!removeBackground) {
                showStatus('AI model not loaded. Please refresh the page.', 'error');
                return;
            }

            try {
                removeBtn.textContent = "⏳ Processing...";
                removeBtn.disabled = true;
                showStatus('Removing background... This may take a minute.', 'info');

                console.log("Starting background removal...");
                const blob = await removeBackground(selectedFile);
                console.log("Background removed! Blob size:", blob.size);

                const url = URL.createObjectURL(blob);
                console.log("Object URL created:", url);

                resultImg.src = url;
                resultImg.classList.add('show');
                resultPlaceholder.style.display = 'none';
                
                downloadBtn.href = url;
                downloadBtn.download = `no-bg-${selectedFile.name}`;
                downloadBtn.classList.add('show');

                removeBtn.textContent = "Remove Background";
                removeBtn.disabled = false;
                showStatus('✅ Background removed successfully!', 'success');

            } catch (error) {
                console.error("Error removing background:", error);
                showStatus('Error: ' + error.message, 'error');
                removeBtn.textContent = "Remove Background";
                removeBtn.disabled = false;
            }
        };

        console.log("All event listeners attached");
    </script>
</body>
</html>
